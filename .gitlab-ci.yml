image: registry.gitlab.com/sesit/message-ix-canada/message2-kubernetes

stages:
  - test

services:
  - openjdk:11-jre-slim-buster

before_script:
  - apt-get update
  - apt-get install git -y
  - apt-get install default-jdk -y
  - pip install -e . --break-system-packages
  - sed -i 's/option LP = CPLEX ;/option LP = CBC ;/' /usr/local/lib/python3.11/dist-packages/message_ix/model/MESSAGE/auxiliary_settings.gms

job:
  stage: test

  tags:
    - message

  script:
    - echo 'Running pipeline now'
    - python3 MESSAGE_CA.py --report --solve

pages:
  image: python:3.8-buster
  before_script: []
  timeout: 10m
  script:
    - pip install mkdocs mkdocs-material mkdocstrings[python] mkdocs-macros-plugin
    - mkdocs build -d public
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'



