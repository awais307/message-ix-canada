image: registry.gitlab.com/sesit/message-ix

stages:
  - test

services:
  - openjdk:11-jre-slim-buster

before_script:
  - apt-get update
  - apt-get install default-jdk -y
  - pip install -e . --break-system-packages
  - pip install message-ix-models[report] --break-system-packages

kubernetes:
  stage: test

  tags:
    - kubernetes

  script:
    - echo 'Running now '
    - cat /usr/local/lib/python3.11/dist-packages/message_ix/model/MESSAGE/auxiliary_settings.gms
    - sed -i 's/option LP = CPLEX ;/option LP = CBC ;/' /usr/local/lib/python3.11/dist-packages/message_ix/model/MESSAGE/auxiliary_settings.gms
    - cat /usr/local/lib/python3.11/dist-packages/message_ix/model/MESSAGE/auxiliary_settings.gms
    - python3 MESSAGE_CA.py
