name: messageix-canada
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pandas
  - numpy
  - pycountry
  - geotext
  - ixmp
  - message-ix
  - pyam
  - scipy
  - toml
  - ipykernel

  # Include pip dependencies if needed
  - pip
  - pip:
      - geotext  # This package is primarily installed via pip
      - -e .
