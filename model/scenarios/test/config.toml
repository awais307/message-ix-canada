[general]
model_name = "MESSAGEix-CA"
scenario_name = "test"
ix_platform = "local"
version = "new"
annotation = "Initial setup for Canadian energy model."

[pre_process]
    process_historical_data = false
    add_hydrogen_shares = true
    apply_obps_netzero = false
    apply_obps_baseline = false
    [pre_process.add_technology]
        techs = ["ATR.ccs"] 
        nodes = ["all"]


[data]
#TODO Add a read_excel boolean to allow also reading directly from the local database
provincial_input_file = "scenarios/baseline/Provincial_Input_Baseline.xlsx"
scenario_folder = "scenarios/test"

[post_process]
generate_reporter_output = false
export_to_xlsx = false

[model]
solve = false



