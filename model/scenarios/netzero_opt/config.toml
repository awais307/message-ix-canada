[general]
    model_name = "MESSAGEix-CA"
    scenario_name = "netzero_opt"
    ix_platform = "local"
    version = "new"
    annotation = "Initial setup for Canadian energy model."

[pre_process]
    process_historical_data = false
    add_hydrogen_shares = false
    apply_obps_netzero = false
    apply_obps_baseline = false
    [pre_process.add_technology]
        add_techs = true
        techs = ["h2_atr_ccs"] 


[data]
    #TODO Add a read_excel boolean to allow also reading directly from the local database
    provincial_input_file = "scenarios/netzero/model_default_netzero_v2.xlsx"
    scenario_folder = "scenarios/netzero_opt"

[model]
    solve = true

[post_process]
    generate_new_reporter_output = true
    generate_legacy_reporter_output = true
    export_to_xlsx = false # export reports to Excel
    generate_pdfs = false # generate results as PDFs
    export_to_csv = false # export reports to CSV






