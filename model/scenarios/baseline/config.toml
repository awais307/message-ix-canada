[general]
    model_name = "MESSAGEix-CA"
    scenario_name = "baseline"
    ix_platform = "local"
    version = "new"
    annotation = "Initial setup for Canadian energy model."

[pre_process]
    process_historical_data = false
    add_hydrogen_shares = false
    [pre_process.add_technology]
        add_techs = true
        techs = ["h2_atr_ccs", "gas_h2", "h2_stor_geo", "liq_h2", "h2_atr", "h2_gas_fc_trp", "meth_h2"] 

[policies]
    apply_obps_netzero = false
    apply_obps_baseline = false

[data]
    #TODO Add a read_excel boolean to allow also reading directly from the local database
    provincial_input_file = "scenarios/baseline/model_default_v10.xlsx"
    scenario_folder = "scenarios/baseline"

    # Brendan's config
    #provincial_input_file = "scenarios/baseline/model_default_v2_no_new_EF_no_share.xlsx"
    #scenario_folder = "scenarios/netzero"

[model]
    solve = false

[post_process]
    generate_reporter_output = true
    generate_new_reporter_output = true
    generate_legacy_reporter_output = true
    export_to_xlsx = true # export model file to Excel
    generate_pdfs = false # generate results as PDFs
    export_to_csv = false # export reports to CSV
    generate_reporter_output = false

    # Brendan's config
    #export_to_xlsx = false


