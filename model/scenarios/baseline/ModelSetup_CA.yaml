region_config:
  region: Canada
  per_region:
    Abb: []             # explicitly mark empty lists if intended
    Countries: []
    Parent: []
    GDP: []
    Keep_Parent: []
    historical_split: []

scenario_config:
  platform:
    name: local
    jvmargs: -Xmx16g
    provincial_input_file_sheets_overwrite: ["tax_emission"]
  source_scenario:
    model: MESSAGEix-CA
    solve: true          # YAML booleans are lowercase
    scenario: baseline
    scenario_name: baseline_obps
    annotation: "Initial setup for Canadian energy model."
    version: new

  policy_config:
    add_technology_techs:
      - h2_atr_ccs
      - gas_h2
      - h2_stor_geo
      - liq_h2
      - h2_atr
      - h2_gas_fc_trp
      - meth_h2
    process_historical: false
    apply_renewable_potential: false
    apply_cer: false
    add_hydrogen_shares_f: false
    add_techs: false
    investment_tax_credit: false
    apply_obps: true
    obps_excel_sheet: "New_OBPS_Stringent"
    obps_policy_carbon_cost:
      2025: 165.4251
      2030: 285.2156 
      more_than_2035: 387.89325
  post_process_config:
    to_excell: false
    legacy_reporter: true
    new_reporter: false
    IDEA_format: true
    validation: false

path_config:
  provincial_input_file: scenarios/baseline/model_default_v32.xlsx
    provincial_input_file_override: model/scenarios/baseline/model_default_v32_override.xlsx
  scenario_folder: scenarios/baseline
  out_dir: model/output
  ITC_policy_input_data: ./data/assumptions_database_example(ITCs).csv
  OBPS_policy_input_data: ./data/New_OBPS.xlsx
  OBPS_credits_output_path : "./data/OBPS/OBPS_credits.csv"
  OBPS_mapping_input_data: "data/OBPS/obps_mapping_msg.xlsx"
  fix_cost_no_obps_input_data: "./data/OBPS/fix_cost_no_obps.csv"
  var_cost_no_obps_input_data: "./data/OBPS/var_cost_no_obps.csv"
  obps_standart_merged_data_output: "./data/obps_standard.csv"
