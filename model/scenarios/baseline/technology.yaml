ATRccs:
  technology: h2_atr_ccs
  mode: M1
  # Commodity structure = input or output: (commodity, value, level)
  commodity: 
    - input: 
      - com_name: [gas, electr]
      - com_value: [1.2, 0.05]
      - com_level: [primary, primary]
    - output: 
      - com_name: h2
      - com_value: 1
      - com_level: secondary 
  time: year
  tec_lifetime: 10
  unit: '-'
  description: natural gas type technology
  # Specify "all" for all provinces in Canada to be selected, or "custom" for a sub-set of provinces
  node_select: all 
  provinces: 
    - Alberta
    - Saskatchewan
  inv_cost_2020: 0
  fix_cost_2020: 0
  var_cost_2020: 0
  emission: CO2
  exo_lr: 0.2



