[general]
    model_name = "MESSAGEix-CA"
    scenario_name = "dacs"
    ix_platform = "local"
    version = "new"
    annotation = "Initial setup for Canadian energy model."

[pre_process]
    process_historical_data = true
    add_hydrogen_shares = false
    [pre_process.add_technology]
        add_techs = true
        techs = ["dac_ht", "dacx_lt", "co2_stor", "co2_tr_sd", "co2_tr_ld"] 

[policies]
    apply_obps = true
    

[data]
    #TODO Add a read_excel boolean to allow also reading directly from the local database
    provincial_input_file = "scenarios/dacs/model_default_v19.xlsx"
    scenario_folder = "scenarios/dacs"
    ITC_policy_input_data = "./data/assumptions_database_example(ITCs).csv"

[model]
    solve = true

[post_process]
    generate_reporter_output = true
    generate_new_reporter_output = false
    generate_legacy_reporter_output = false
    export_to_xlsx = false # export model file to Excel
    generate_pdfs = false # generate results as PDFs
    export_to_csv = false # export reports to CSV


