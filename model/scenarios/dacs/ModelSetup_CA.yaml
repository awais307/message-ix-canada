  per_region:
    Abb: 
    Countries: 
    Parent: 
    GDP: 
    Keep_Parent: 
    historical_split:
scenario_config:
  platform:
    name: local
    jvmargs: -Xmx16g
  source_scenario:
    model: MESSAGEix-CA
    solve: True
    scenario: dacs
    annotation: Initial setup for Canadian energy model.
    version: new
  policy_config:
    add_technology_techs: ["dac_ht", "dacx_lt", "co2_stor", "co2_tr_sd", "co2_tr_ld"]
